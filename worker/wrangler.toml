# Lets Cloudflare build and deploy this Worker straight from GitHub (Workers Builds), so a push updates it.
# Secrets (OSU_CLIENT_ID, OSU_CLIENT_SECRET) stay in the Cloudflare dashboard; keep_vars stops a deploy from erasing them.
name = "osu-lookup"
main = "osu-lookup.js"
compatibility_date = "2025-01-01"
keep_vars = true
